name = "tonnage-coach"
main = "worker.js"
compatibility_date = "2024-11-01"

# Free messages per device per day (server-enforced). Override without redeploying via
# `wrangler deploy --var DAILY_LIMIT:50` or edit here.
[vars]
DAILY_LIMIT = "30"

# KV namespace for the per-device daily counters. Create it once with:
#   wrangler kv namespace create QUOTA
# then paste the returned id below (and the preview_id if you use `wrangler dev`).
[[kv_namespaces]]
binding = "QUOTA"
id = "59500a74893248b6b8c31dd1a1fd1743"

# NOTE: the Anthropic key is NOT here. Set it as a secret (never committed):
#   wrangler secret put ANTHROPIC_API_KEY
